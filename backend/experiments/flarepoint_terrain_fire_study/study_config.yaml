study_name: flarepoint_terrain_fire_study
random_seed: 42
region:
  name: Northern California (Klamath-Trinity & Upper Sacramento)
  bbox_wgs84: [-124.2, 39.5, -121.0, 42.0]  # west, south, east, north
  analysis_crs: EPSG:32610
  boundary_note: Exploratory bounding box; excludes ocean cells where DEM is NaN/<=0
temporal:
  start_date: "2024-08-01"
  end_date: "2024-08-20"
  chunk_days: 5
firms:
  source: VIIRS_SNPP_SP
  min_confidence: "l"
terrain:
  dataset: Copernicus DEM GLO-30
  strict_real_data: true
  scales_m: [250, 500, 1000, 3000]
  flat_slope_threshold_deg: 5.0
grid:
  cell_size_m: 15000.0  # 15 km x 15 km background grid cells in EPSG:32610
bins:
  elevation_m: [0, 250, 500, 750, 1000, 1500, 2000, 5000]
  slope_deg: [0, 5, 15, 30, 45, 90]
statistics:
  alpha: 0.05
  fdr_method: benjamini_hochberg
