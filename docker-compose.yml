services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: flarepoint-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flarepoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flarepoint}
      POSTGRES_DB: ${POSTGRES_DB:-flarepoint}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flarepoint} -d ${POSTGRES_DB:-flarepoint}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flarepoint-backend
    env_file:
      - .env.example
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://flarepoint:flarepoint@postgres:5432/flarepoint}
      DEMO_MODE: ${DEMO_MODE:-true}
      NASA_FIRMS_MAP_KEY: ${NASA_FIRMS_MAP_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flarepoint-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
